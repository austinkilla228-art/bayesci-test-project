cat > .github/workflows/ci.yml <<'EOF'
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: gcc -Wall -Wextra -o app src/main.c

      - name: Run
        run: ./app
EOF
